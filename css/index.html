<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona Główna</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation" aria-hidden="true">
        <div class="bg-grid"></div>
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
        <div class="particles">
            <span class="p p1"></span>
            <span class="p p2"></span>
            <span class="p p3"></span>
            <span class="p p4"></span>
            <span class="p p5"></span>
            <span class="p p6"></span>
            <span class="p p7"></span>
            <span class="p p8"></span>
        </div>
    </div>

    <div class="top-loader-bar"></div>

    <nav>
        <ul>
            <li><a href="StronaGlowna.html">Strona główna</a></li>
            <li><a href="login.html">Zaloguj się / Zarejestruj się</a></li>
        </ul>
    </nav>

    <main>
        <div id="loginModal">
            <div class="card-scanner"></div>

            <div class="loader-overlay" id="loaderOverlay">
                <div class="orbital-spinner">
                    <div class="ring ring-1"></div>
                    <div class="ring ring-2"></div>
                    <div class="ring ring-3"></div>
                    <div class="core-pulse"></div>
                </div>
                <div class="loader-status">
                    <div class="loader-text">Autoryzacja</div>
                    <div class="loader-subtext">Weryfikacja</div>
                </div>
            </div>

            <form id="loginForm" action="main.php" method="post">
                <label for="login">Login:</label>
                <input type="text" name="login" id="login-txt" autocomplete="username" placeholder="Wpisz swój login">
                
                <label for="password">Hasło:</label>
                <input type="password" name="password" id="password-txt" autocomplete="current-password" placeholder="Wpisz hasło">
                
                <button type="submit" id="login-btn">
                    <span class="btn-text">Zaloguj się</span>
                    <span class="btn-loader">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </span>
                </button>
                <p id="blad"></p>
            </form>
        </div>
    </main>

    <script>
    window.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('login-btn');
        const loaderOverlay = document.getElementById('loaderOverlay');
        const loginInput = document.getElementById('login-txt');
        const passwordInput = document.getElementById('password-txt');
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');

        if (error === '0') {
            loginInput?.classList.add('error');
            passwordInput?.classList.add('error');
        } else if (error === '1') {
            loginInput?.classList.add('error');
        } else if (error === '2') {
            passwordInput?.classList.add('error');
        }

        if (error !== null) {
            setTimeout(() => {
                loginInput?.classList.remove('error');
                passwordInput?.classList.remove('error');
            }, 800);
        }

        function triggerLoading(duration = 1800, onComplete) {
            loginBtn.classList.add('loading');
            loaderOverlay.classList.add('active');

            setTimeout(() => {
                loginBtn.classList.remove('loading');
                loaderOverlay.classList.remove('active');
                if (onComplete) onComplete();
            }, duration);
        }

        form?.addEventListener('submit', (e) => {
            const hasLogin = loginInput && loginInput.value.trim() !== '';
            const hasPassword = passwordInput && passwordInput.value.trim() !== '';

            if (!hasLogin || !hasPassword) {
                e.preventDefault();
                triggerLoading(1200, () => {
                    if (!hasLogin) loginInput?.classList.add('error');
                    if (!hasPassword) passwordInput?.classList.add('error');

                    setTimeout(() => {
                        loginInput?.classList.remove('error');
                        passwordInput?.classList.remove('error');
                    }, 800);
                });
            } else {
                e.preventDefault();
                triggerLoading(1500, () => {
                    form.submit();
                });
            }
        });
    });
    </script>
</body>
</html>
